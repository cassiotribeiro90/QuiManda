name: quimanda
description: "O app do lojista."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^8.1.3
  get_it: ^7.6.0
  dio: ^5.3.2
  shared_preferences: ^2.2.2
  intl: ^0.18.1
  equatable: ^2.0.5
  go_router: ^13.2.0
  url_strategy: ^0.2.0
  cached_network_image: ^3.3.0
  mask_text_input_formatter: ^2.5.0
  flutter_secure_storage: ^9.0.0
  flutter_colorpicker: ^1.1.0
  fl_chart: 0.68.0
  url_launcher: ^6.3.1
  flutter_tts: ^4.2.5
  webview_flutter: ^4.7.0
  webview_windows: ^0.4.0
  universal_io: ^2.0.4
  uuid: ^4.5.1
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.10  # 🔥 CORRIGIDO
  flutter_local_notifications: ^18.0.1
  shimmer: ^3.0.0
  image_picker: ^1.0.5
  flutter_image_compress: ^2.1.0
  path_provider: ^2.1.0

  web: ^1.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.13.1
  flutter_launcher_icons: ^0.13.1

  shelf: ^1.4.2
  shelf_router: ^1.1.4

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 48
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

