<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="QuiManda - Gestão de Pedidos">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="QuiManda">

  <!-- 🔥 FIREBASE - Dependências -->
  <script src="https://www.gstatic.com/firebasejs/11.4.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.4.0/firebase-messaging-compat.js"></script>

  <!-- 🔥 REGISTRA O SERVICE WORKER DO FCM -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/firebase-messaging-sw.js')
          .then(function(registration) {
            console.log('✅ Service Worker registrado:', registration.scope);
          })
          .catch(function(err) {
            console.warn('❌ Erro ao registrar Service Worker:', err);
          });
      });
    }

    // Verifica se o Firebase está disponível
    if (typeof firebase !== 'undefined') {
      console.log('✅ Firebase disponível');
    } else {
      console.warn('⚠️ Firebase não disponível');
    }
  </script>

  <!-- 🔥 SPEECHSYNTHESIS - VERSÃO INTELIGENTE -->
