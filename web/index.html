<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="quimanda">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>quimanda</title>
  <link rel="manifest" href="manifest.json">

  <!-- 🔥 SPEECHSYNTHESIS - VERSÃO INTELIGENTE -->
  <script>
    (function() {
      if ('speechSynthesis' in window) {
        console.log('✅ SpeechSynthesis disponível');

        // Carrega vozes
        window.speechSynthesis.getVoices();
        window.speechSynthesis.onvoiceschanged = function() {
          console.log('✅ Vozes carregadas:', window.speechSynthesis.getVoices().length);
        };

        // 🔥 KEEP-ALIVE INTELIGENTE
        function keepAlive() {
          try {
            // 🔥 SÓ EXECUTA SE NÃO ESTIVER FALANDO
            if (!window.speechSynthesis.speaking) {
              var utterance = new SpeechSynthesisUtterance(' ');
              utterance.lang = 'pt-BR';
              utterance.volume = 0;
              window.speechSynthesis.speak(utterance);

              // 🔥 CANCELA APÓS 50ms, MAS SÓ SE NÃO ESTIVER FALANDO
              setTimeout(function() {
                if (!window.speechSynthesis.speaking) {
                  window.speechSynthesis.cancel();
                }
              }, 50);
            }
          } catch(e) {
            // Ignora
          }
        }

        // 🔥 EXECUTA A CADA 20 SEGUNDOS (menos frequente)
        setInterval(keepAlive, 20000);

        // Ativa no primeiro clique
        document.addEventListener('click', function() {
          keepAlive();
        }, { once: true });

        console.log('✅ SpeechSynthesis inicializado');
      }
    })();
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
